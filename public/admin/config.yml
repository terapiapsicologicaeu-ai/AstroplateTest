backend:
  name: github
  repo: tuonomeutente/tuorepo # <-- sostituisci con il repo reale prima del deploy GitHub
  branch: main

media_folder: "public/images"
public_folder: "/images"

output:
  omit_empty_optional_fields: true

field_defaults:
  richtext:
    # Only the visual rich-text mode: the toolbar inserts real formatting,
    # not literal Markdown backticks.
    modes: [rich_text]
    allow_nested_components: exclude_self
    # Built-in “link” button removed: the custom “Link” component handles
    # internal pages/posts, external URLs and the new-tab option.
    buttons:
      [
        bold,
        italic,
        strikethrough,
        code,
        heading-one,
        heading-two,
        heading-three,
        heading-four,
        heading-five,
        heading-six,
        bulleted-list,
        numbered-list,
        quote,
      ]
    editor_components:
      [
        code-block,
        code-snippet,
        image,
        table,
        hr,
        notice,
        internal-link,
        button,
        accordion,
        tabs,
        map,
        youtube,
      ]

collections:
  # 1. Blog
  - name: "blog"
    label: "Articoli & Post"
    label_singular: "Articolo"
    icon: "article"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} · {{date | date('MMM D, YYYY')}}"
    thumbnail: "image"
    sortable_fields:
      fields: [title, date, author]
      default:
        field: date
        direction: descending
    view_filters:
      filters:
        - name: pubblicati
          label: "Pubblicati"
          field: draft
          pattern: false
        - name: bozze
          label: "Bozze"
          field: draft
          pattern: true
    table_columns:
      - title
      - { field: "{{date | date('MMM D, YYYY')}}", label: "Data" }
      - author
      - categories
      - tags
      - draft
    index_file:
      name: "-index"
      label: "Impostazioni elenco blog"
      icon: "settings"
      summary: "{{title}}"
      editor:
        preview: false
      fields:
        - { label: "Titolo", name: "title", widget: "string" }
        - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
        - { label: "Descrizione", name: "description", widget: "text", required: false }
        - { label: "Data", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD", required: false }
        - { label: "Immagine", name: "image", widget: "image", required: false }
        - { label: "Bozza", name: "draft", widget: "boolean", required: false }
        - { label: "Contenuto", name: "body", widget: "markdown" }
    bulk_edit:
      fields: [title, date, author, draft]
    view_groups:
      groups:
        - name: year
          label: "Anno"
          field: date
          pattern: \d{4}
        - name: author
          label: "Autore"
          field: author
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Meta Title", name: "meta_title", widget: "string", required: false, hint: "Titolo SEO opzionale." }
      - { label: "Descrizione", name: "description", widget: "text", required: false, hint: "Usata per SEO e anteprime." }
      - { label: "Data", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD", default: "{{now}}", hint: "Data di pubblicazione." }
      - { label: "Immagine", name: "image", widget: "image", required: false, hint: "Consigliato 1200x630 px." }
      - label: "Autore"
        name: "author"
        widget: "relation"
        collection: "authors"
        value_field: "{{title}}"
        display_fields: ["title"]
        search_fields: ["title"]
        required: true
        hint: "Seleziona un autore esistente."
      - label: "Categorie"
        name: "categories"
        widget: "tags"
        taxonomy_key: "categories"
        default: ["others"]
        options:
          [
            "Application",
            "Architecture",
            "Data",
            "Software",
            "Technology",
            "others",
            "Psicologia",
            "Psicoterapia",
            "Neuroscenze",
            "Intelligenza Artificiale",
          ]
        hint: "Seleziona le categorie esistenti o scrivine una nuova e premi Invio."
      - label: "Tag"
        name: "tags"
        widget: "tags"
        taxonomy_key: "tags"
        default: ["others"]
        options:
          [
            "Mio primo tag",
            "Mio secondo tag",
            "nextjs",
            "others",
            "silicon",
            "software",
            "tailwind",
            "technology",
            "primo tag",
            "secondo tag",
          ]
        hint: "Seleziona i tag esistenti o scrivine uno nuovo e premi Invio."
      - { label: "Bozza", name: "draft", widget: "boolean", default: false }
      - { label: "Contenuto", name: "body", widget: "markdown", hint: "Usa i pulsanti Tip/Avviso e Link interno nella toolbar." }

  # 2. Pagine
  - name: "pages"
    label: "Pagine"
    label_singular: "Pagina"
    icon: "description"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
      - { label: "Descrizione", name: "description", widget: "text", required: false }
      - { label: "Data", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD", required: false }
      - { label: "Immagine", name: "image", widget: "image", required: false, hint: "Consigliato almeno 1200x400 px. Viene mostrata come sfondo dietro il titolo." }
      - { label: "Bozza", name: "draft", widget: "boolean", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown", hint: "I file .mdx con componenti JSX vanno modificati nel codice." }

  # 3. Autori
  - name: "authors"
    label: "Autori"
    icon: "group"
    folder: "src/content/authors"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Meta Title", name: "meta_title", widget: "string", required: false, hint: "Titolo SEO opzionale." }
      - { label: "Descrizione", name: "description", widget: "text", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Immagine", name: "image", widget: "image", required: false, hint: "Consigliato quadrato (es. 400x400)." }
      - label: "Social"
        name: "social"
        widget: "list"
        required: false
        label_singular: "Social"
        summary: "{{fields.name}} → {{fields.link}}"
        fields:
          - { label: "Nome", name: "name", widget: "string" }
          - { label: "Icona", name: "icon", widget: "string", hint: "Es. FaGithub, FaTwitter, FaLinkedin (react-icons/fa6)." }
          - { label: "Link", name: "link", widget: "string" }
      - { label: "Bozza", name: "draft", widget: "boolean", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }
    index_file:
      name: "-index"
      label: "Impostazioni elenco autori"
      icon: "settings"
      summary: "{{title}}"
      editor:
        preview: false
      fields:
        - { label: "Titolo", name: "title", widget: "string" }
        - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
        - { label: "Descrizione", name: "description", widget: "text", required: false }
        - { label: "Immagine", name: "image", widget: "image", required: false }
        - { label: "Bozza", name: "draft", widget: "boolean", required: false }
        - { label: "Contenuto", name: "body", widget: "markdown" }

  # 4. About
  - name: "about"
    label: "About"
    icon: "info"
    files:
      - label: "About"
        name: "about"
        file: "src/content/about/-index.md"
        fields:
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Descrizione", name: "description", widget: "text", required: false }
          - { label: "Data", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD", required: false }
          - { label: "Immagine", name: "image", widget: "image", required: false, hint: "Consigliato 1200x630 px." }
          - { label: "Bozza", name: "draft", widget: "boolean", required: false }
          - { label: "Contenuto", name: "body", widget: "markdown" }

  # 5. Contact
  - name: "contact"
    label: "Contatti"
    icon: "mail"
    files:
      - label: "Contatti"
        name: "contact"
        file: "src/content/contact/-index.md"
        fields:
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Descrizione", name: "description", widget: "text", required: false }
          - { label: "Data", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD", required: false }
          - { label: "Immagine", name: "image", widget: "image", required: false, hint: "Consigliato 1200x630 px." }
          - { label: "Bozza", name: "draft", widget: "boolean", required: false }
          - { label: "Contenuto", name: "body", widget: "markdown" }

  # 6. Homepage
  - name: "homepage"
    label: "Homepage"
    icon: "home"
    files:
      - label: "Homepage"
        name: "homepage"
        file: "src/content/homepage/-index.md"
        fields:
          - { label: "Titolo interno", name: "title", widget: "string", required: false }
          - { label: "Bozza", name: "draft", widget: "boolean", required: false }
          - label: "Banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Contenuto", name: "content", widget: "text" }
              - { label: "Immagine", name: "image", widget: "image", hint: "Consigliato 1200x380 px o più grande." }
              - label: "Pulsante"
                name: "button"
                widget: "object"
                fields:
                  - { label: "Abilita", name: "enable", widget: "boolean" }
                  - { label: "Etichetta", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }
          - label: "Caratteristiche"
            name: "features"
            widget: "list"
            label_singular: "Caratteristica"
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Contenuto", name: "content", widget: "text" }
              - { label: "Immagine", name: "image", widget: "image", hint: "Consigliato 520x480 px." }
              - label: "Punti elenco"
                name: "bulletpoints"
                widget: "list"
                label_singular: "Punto"
                hint: "Un punto per riga."
              - label: "Pulsante"
                name: "button"
                widget: "object"
                fields:
                  - { label: "Abilita", name: "enable", widget: "boolean" }
                  - { label: "Etichetta", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }
          - { label: "Contenuto libero", name: "body", widget: "markdown", required: false, hint: "Testo mostrato dopo le caratteristiche, prima delle testimonianze. Usa la toolbar per formattare." }
          - label: "Moduli di testo"
            name: "modules"
            widget: "list"
            label_singular: "Modulo"
            summary: "{{fields.position}} — {{fields.title}}"
            collapsed: true
            required: false
            hint: "Blocchi di testo libero mostrati nella home. Scegli la posizione e usa l'editor per formattare."
            fields:
              - label: "Posizione"
                name: "position"
                widget: "select"
                default: "after_features"
                options:
                  - { label: "Dopo il banner", value: "after_banner" }
                  - { label: "Dopo le caratteristiche", value: "after_features" }
                  - { label: "Prima della CTA", value: "before_cta" }
              - { label: "Titolo (opzionale)", name: "title", widget: "string", required: false }
              - { label: "Contenuto", name: "content", widget: "markdown", hint: "Testo del modulo. Sono supportati titoli, liste, grassetto, link e immagini." }
              - { label: "Immagine (opzionale)", name: "image", widget: "image", required: false, hint: "Se presente, il testo va a fianco dell'immagine." }
              - { label: "Immagine a destra", name: "image_right", widget: "boolean", default: false, required: false }

  # 7. Sezioni
  - name: "sections"
    label: "Sezioni"
    icon: "view_quilt"
    files:
      - label: "Call to Action"
        name: "cta"
        file: "src/content/sections/call-to-action.md"
        fields:
          - { label: "Abilita", name: "enable", widget: "boolean" }
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Descrizione", name: "description", widget: "text" }
          - { label: "Immagine", name: "image", widget: "image", hint: "Consigliato 1200x630 px." }
          - label: "Pulsante"
            name: "button"
            widget: "object"
            fields:
              - { label: "Abilita", name: "enable", widget: "boolean" }
              - { label: "Etichetta", name: "label", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }
      - label: "Testimonianze"
        name: "testimonial"
        file: "src/content/sections/testimonial.md"
        fields:
          - { label: "Abilita", name: "enable", widget: "boolean" }
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Descrizione", name: "description", widget: "text" }
          - label: "Testimonianze"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "Avatar", name: "avatar", widget: "image", hint: "Consigliato quadrato (es. 200x200)." }
              - { label: "Ruolo", name: "designation", widget: "string" }
              - { label: "Contenuto", name: "content", widget: "text" }

singletons:
  # Tassonomie (categorie e tag disponibili)
  - name: "taxonomy"
    label: "Tassonomie"
    icon: "sell"
    file: "public/data/taxonomy.json"
    fields:
      - label: "Categorie"
        name: "categories"
        widget: "list"
        label_singular: "Categoria"
        hint: "Aggiungi qui le categorie disponibili nei post."
      - label: "Tag"
        name: "tags"
        widget: "list"
        label_singular: "Tag"
        hint: "Aggiungi qui i tag disponibili nei post."

  # Impostazioni sito (config.json)
  - name: "site_config"
    label: "Impostazioni Sito"
    icon: "settings"
    file: "src/config/config.json"
    fields:
      - label: "Sito"
        name: "site"
        widget: "object"
        fields:
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Base URL", name: "base_url", widget: "string", hint: "Es. https://tuodominio.it" }
          - { label: "Base Path", name: "base_path", widget: "string" }
          - { label: "Trailing Slash", name: "trailing_slash", widget: "boolean" }
          - { label: "Favicon", name: "favicon", widget: "image", required: false, hint: "Consigliato 512x512 px." }
          - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Consigliato 150x30 px." }
          - { label: "Logo Darkmode", name: "logo_darkmode", widget: "image", required: false, hint: "Consigliato 150x30 px." }
          - { label: "Larghezza Logo", name: "logo_width", widget: "string" }
          - { label: "Altezza Logo", name: "logo_height", widget: "string" }
          - { label: "Testo Logo", name: "logo_text", widget: "string" }
      - label: "Impostazioni"
        name: "settings"
        widget: "object"
        fields:
          - { label: "Ricerca", name: "search", widget: "boolean" }
          - { label: "Header Sticky", name: "sticky_header", widget: "boolean" }
          - { label: "Theme Switcher", name: "theme_switcher", widget: "boolean" }
          - { label: "Tema Predefinito", name: "default_theme", widget: "select", options: ["system", "light", "dark"] }
          - { label: "Paginazione", name: "pagination", widget: "number", value_type: int }
          - { label: "Lunghezza Sommario", name: "summary_length", widget: "number", value_type: int }
          - { label: "Cartella Blog", name: "blog_folder", widget: "string" }
      - label: "Annuncio"
        name: "announcement"
        widget: "object"
        fields:
          - { label: "Abilita", name: "enable", widget: "boolean" }
          - { label: "Contenuto", name: "content", widget: "text" }
          - { label: "Giorni di scadenza", name: "expire_days", widget: "number", value_type: int }
      - label: "Parametri"
        name: "params"
        widget: "object"
        fields:
          - { label: "Azione Form Contatto", name: "contact_form_action", widget: "string" }
          - { label: "Copyright", name: "copyright", widget: "string", hint: "Supporta Markdown (es. link)." }
      - label: "Pulsante Navigazione"
        name: "navigation_button"
        widget: "object"
        fields:
          - { label: "Abilita", name: "enable", widget: "boolean" }
          - { label: "Etichetta", name: "label", widget: "string" }
          - { label: "Link", name: "link", widget: "string" }
      - label: "Google Tag Manager"
        name: "google_tag_manager"
        widget: "object"
        fields:
          - { label: "Abilita", name: "enable", widget: "boolean" }
          - { label: "GTM ID", name: "gtm_id", widget: "string" }
      - label: "Disqus"
        name: "disqus"
        widget: "object"
        fields:
          - { label: "Abilita", name: "enable", widget: "boolean" }
          - { label: "Shortname", name: "shortname", widget: "string" }
          - label: "Impostazioni Disqus"
            name: "settings"
            widget: "object"
            required: false
            fields:
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Identifier", name: "identifier", widget: "string", required: false }
              - { label: "Titolo", name: "title", widget: "string", required: false }
      - label: "Metadata"
        name: "metadata"
        widget: "object"
        fields:
          - { label: "Autore Meta", name: "meta_author", widget: "string" }
          - { label: "Immagine OG", name: "meta_image", widget: "image", required: false, hint: "Consigliato 1200x630 px." }
          - { label: "Descrizione Meta", name: "meta_description", widget: "text" }
      - label: "LLMs"
        name: "llms"
        widget: "object"
        fields:
          - { label: "Genera llms.txt", name: "generate_llms_txt", widget: "boolean" }
          - { label: "Genera llms-full.txt", name: "generate_llms_full_txt", widget: "boolean" }
          - { label: "Genera MD individuali", name: "generate_individual_md", widget: "boolean" }
          - { label: "Include", name: "include", widget: "list", required: false }
          - { label: "Exclude", name: "exclude", widget: "list", required: false }

  # Menu
  - name: "menu"
    label: "Menu di Navigazione"
    icon: "menu"
    file: "src/config/menu.json"
    fields:
      - label: "Menu Principale"
        name: "main"
        widget: "list"
        label_singular: "Voce"
        summary: "{{name}}"
        fields:
          - { label: "Nome", name: "name", widget: "string" }
          - label: "Pagina interna"
            name: "page"
            widget: "relation"
            collection: "pages"
            value_field: "{{slug}}"
            display_fields: ["{{title}}"]
            search_fields: ["title"]
            required: false
            hint: "Ha priorità sull'URL personalizzato."
          - label: "Articolo del blog"
            name: "post"
            widget: "relation"
            collection: "blog"
            value_field: "{{slug}}"
            display_fields: ["{{title}}"]
            search_fields: ["title"]
            required: false
            hint: "Ha priorità sull'URL personalizzato."
          - { label: "URL personalizzato / esterno", name: "url", widget: "string", required: false, hint: "Es. https://... oppure /percorso." }
          - label: "Figli"
            name: "children"
            widget: "list"
            required: false
            label_singular: "Figlio"
            summary: "{{name}}"
            fields:
              - { label: "Nome", name: "name", widget: "string" }
              - label: "Pagina interna"
                name: "page"
                widget: "relation"
                collection: "pages"
                value_field: "{{slug}}"
                display_fields: ["{{title}}"]
                search_fields: ["title"]
                required: false
              - label: "Articolo del blog"
                name: "post"
                widget: "relation"
                collection: "blog"
                value_field: "{{slug}}"
                display_fields: ["{{title}}"]
                search_fields: ["title"]
                required: false
              - { label: "URL personalizzato / esterno", name: "url", widget: "string", required: false }
      - label: "Menu Footer"
        name: "footer"
        widget: "list"
        label_singular: "Voce"
        summary: "{{name}}"
        fields:
          - { label: "Nome", name: "name", widget: "string" }
          - label: "Pagina interna"
            name: "page"
            widget: "relation"
            collection: "pages"
            value_field: "{{slug}}"
            display_fields: ["{{title}}"]
            search_fields: ["title"]
            required: false
          - label: "Articolo del blog"
            name: "post"
            widget: "relation"
            collection: "blog"
            value_field: "{{slug}}"
            display_fields: ["{{title}}"]
            search_fields: ["title"]
            required: false
          - { label: "URL personalizzato / esterno", name: "url", widget: "string", required: false }

  # Social
  - name: "social"
    label: "Social Links"
    icon: "share"
    file: "src/config/social.json"
    fields:
      - label: "Social Principali"
        name: "main"
        widget: "list"
        summary: "{{name}} → {{link}}"
        fields:
          - { label: "Nome", name: "name", widget: "string" }
          - { label: "Icona", name: "icon", widget: "string", hint: "Es. FaGithub, FaXTwitter (react-icons/fa6)." }
          - { label: "Link", name: "link", widget: "string" }

  # Tema
  - name: "theme"
    label: "Tema (Colori & Font)"
    icon: "palette"
    file: "src/config/theme.json"
    fields:
      - label: "Colori"
        name: "colors"
        widget: "object"
        fields:
          - label: "Default"
            name: "default"
            widget: "object"
            fields:
              - label: "Colore Tema"
                name: "theme_color"
                widget: "object"
                fields:
                  - { label: "Primario", name: "primary", widget: "color" }
                  - { label: "Body", name: "body", widget: "color" }
                  - { label: "Bordo", name: "border", widget: "color" }
                  - { label: "Chiaro", name: "light", widget: "color" }
                  - { label: "Scuro", name: "dark", widget: "color" }
              - label: "Colore Testo"
                name: "text_color"
                widget: "object"
                fields:
                  - { label: "Testo", name: "text", widget: "color" }
                  - { label: "Testo Scuro", name: "text_dark", widget: "color" }
                  - { label: "Testo Chiaro", name: "text_light", widget: "color" }
          - label: "Dark Mode"
            name: "darkmode"
            widget: "object"
            fields:
              - label: "Colore Tema"
                name: "theme_color"
                widget: "object"
                fields:
                  - { label: "Primario", name: "primary", widget: "color" }
                  - { label: "Body", name: "body", widget: "color" }
